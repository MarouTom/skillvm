<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">skillvm: the version manager for agent skills</title>
  <desc id="desc">The name skillvm beside the real version history of an installed skill: four upstream commits of astropy, the newest marked installed, with an arrow showing a rollback to version 1.2.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8B949E"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="24" fill="#0E1116"/>

  <g id="title-block" transform="translate(64 0)">
    <text x="0" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3" fill="#8B949E">VERSION MANAGER FOR AGENT SKILLS</text>
    <text x="-4" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="96" font-weight="700" fill="#F2EFE8">skillvm</text>
    <rect x="410" y="128" width="14" height="76" fill="#3FB950"/>
    <text x="0" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" fill="#D7D3CB">Install, update and roll back Claude Code</text>
    <text x="0" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" fill="#D7D3CB">and Codex skills from GitHub, with proof</text>
    <text x="0" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" fill="#D7D3CB">of where each one came from.</text>
    <text x="0" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B949E">claude code · codex · python 3.8+ · no pip installs</text>
  </g>

  <g id="version-rail" transform="translate(660 56)">
    <rect width="476" height="308" rx="16" fill="#151A21" stroke="#2A2F37" stroke-width="1.5"/>
    <text x="28" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#8B949E"><tspan fill="#3FB950">$</tspan> check.py --history astropy</text>
    <line x1="28" y1="68" x2="448" y2="68" stroke="#2A2F37" stroke-width="1.5"/>

    <line x1="44" y1="108" x2="44" y2="270" stroke="#2A2F37" stroke-width="3"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">
      <circle cx="44" cy="108" r="11" fill="none" stroke="#3FB950" stroke-width="2" opacity="0.5"/>
      <circle cx="44" cy="108" r="7" fill="#3FB950"/>
      <text x="72" y="115" fill="#F2EFE8">a92663a</text>
      <text x="180" y="115" fill="#F2EFE8" font-weight="700">1.5</text>
      <rect x="236" y="92" width="114" height="32" rx="16" fill="#3FB950" fill-opacity="0.14" stroke="#3FB950" stroke-width="1.5"/>
      <text x="293" y="114" text-anchor="middle" font-size="18" fill="#3FB950">installed</text>

      <circle cx="44" cy="162" r="7" fill="#0E1116" stroke="#8B949E" stroke-width="2"/>
      <text x="72" y="169" fill="#B8B4AC">ce9e6e9</text>
      <text x="180" y="169" fill="#B8B4AC">1.4</text>

      <circle cx="44" cy="216" r="7" fill="#0E1116" stroke="#8B949E" stroke-width="2"/>
      <text x="72" y="223" fill="#B8B4AC">1e5eeff</text>
      <text x="180" y="223" fill="#B8B4AC">1.3</text>

      <circle cx="44" cy="270" r="7" fill="#0E1116" stroke="#F2EFE8" stroke-width="2"/>
      <text x="72" y="277" fill="#F2EFE8">b085e11</text>
      <text x="180" y="277" fill="#F2EFE8">1.2</text>
    </g>

    <path d="M368 110 C 444 120, 444 258, 254 272" fill="none" stroke="#8B949E" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
    <text x="392" y="196" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#8B949E">roll back</text>
  </g>
</svg>
